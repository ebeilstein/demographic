<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Employee Payroll Setup — City of La Verne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2A43;
    --navy-2:#173B5E;
    --paper:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1E2530;
    --muted:#5B6472;
    --border:#E2DED2;
    --border-2:#D7D2C3;
    --brass:#A9762E;
    --brass-dark:#8A5F22;
    --teal:#2E5D52;
    --teal-bg:#E7EFEC;
    --amber-bg:#FBF0DE;
    --red:#B0392F;
    --red-bg:#FBEAE7;
    --focus:#1B6FB8;
    --radius:10px;
    --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#14181F; --card:#1B212B; --ink:#EAEAE6; --muted:#9BA3AE;
      --border:#2B323D; --border-2:#333B47; --teal-bg:#173029; --amber-bg:#2E2413; --red-bg:#331C19;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14181F; --card:#1B212B; --ink:#EAEAE6; --muted:#9BA3AE;
    --border:#2B323D; --border-2:#333B47; --teal-bg:#173029; --amber-bg:#2E2413; --red-bg:#331C19;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .sidenav li.active button{ color:#F2E4CB; }
  }
  :root[data-theme="dark"] .sidenav li.active button{ color:#F2E4CB; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; color:var(--ink);}
  a{color:var(--focus);}
  button{font-family:var(--sans); cursor:pointer;}
  input,select,textarea{font-family:var(--sans); font-size:14.5px; color:var(--ink);}
  ::selection{background:#c9d9e6;}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--navy); color:#fff; padding:14px 22px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    border-bottom:3px solid var(--brass);
  }
  .topbar .seal{
    width:34px;height:34px;border-radius:50%;background:var(--brass);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);
    font-weight:700; color:var(--navy); flex:none; font-size:15px;
  }
  .topbar .titles{flex:1; min-width:200px;}
  .topbar .titles .city{font-size:12px; letter-spacing:.02em; color:#C9D3DE; margin-bottom:1px;}
  .topbar .titles h1{font-size:18px; color:#fff;}
  .tabs{display:flex; gap:4px; background:rgba(255,255,255,.08); padding:4px; border-radius:9px;}
  .tabs button{
    background:transparent; border:none; color:#D9E1EA; padding:8px 16px; border-radius:6px;
    font-size:13.5px; font-weight:600; transition:background .15s, color .15s;
  }
  .tabs button.active{background:#fff; color:var(--navy);}
  .tabs button .badge{
    display:inline-block; margin-left:6px; background:var(--brass); color:#fff; border-radius:20px;
    padding:0 7px; font-size:11px; line-height:16px; min-width:16px;
  }

  /* ---------- layout ---------- */
  .app{display:flex; min-height:calc(100vh - 66px); max-width:1180px; margin:0 auto;}
  .sidenav{
    width:250px; flex:none; padding:24px 14px 24px 22px; position:sticky; top:0;
    align-self:flex-start; max-height:100vh; overflow-y:auto;
  }
  .sidenav ol{list-style:none; margin:0; padding:0; border-left:2px solid var(--border);}
  .sidenav li{position:relative; margin:0;}
  .sidenav button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:9px 0 9px 18px;
    font-size:13.5px; color:var(--muted); position:relative;
  }
  .sidenav button:hover{color:var(--ink);}
  .sidenav li.active button{color:var(--navy); font-weight:600;}
  :root[data-theme="dark"] .sidenav li.active button, body.dark .sidenav li.active button{color:#fff;}
  .sidenav li .dot{
    position:absolute; left:-7px; top:12px; width:12px; height:12px; border-radius:50%;
    background:var(--card); border:2px solid var(--border-2);
  }
  .sidenav li.active .dot{border-color:var(--brass); background:var(--brass);}
  .sidenav li.done .dot{border-color:var(--teal); background:var(--teal);}
  .sidenav .progress-label{font-size:11.5px; color:var(--muted); padding:0 0 10px 2px; text-transform:uppercase; letter-spacing:.06em;}

  main{flex:1; min-width:0; padding:26px 26px 80px;}
  .section-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px 26px; margin-bottom:20px;
  }
  .section-card h2{font-size:19px; margin-bottom:3px;}
  .section-card .section-desc{color:var(--muted); font-size:13.5px; margin-bottom:18px; max-width:62ch;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 18px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field.span-2{grid-column:span 2;}
  .field label{font-size:12.5px; font-weight:600; color:var(--ink); display:flex; gap:5px; align-items:baseline;}
  .field label .req{color:var(--red); font-weight:700;}
  .field .hint{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .field input, .field select, .field textarea{
    border:1px solid var(--border-2); border-radius:7px; padding:8px 10px; background:var(--card); color:var(--ink);
    width:100%;
  }
  .field textarea{resize:vertical; min-height:60px; font-size:14px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus);
  }
  .field input.err, .field select.err{border-color:var(--red); background:var(--red-bg);}
  .field .errmsg{font-size:11.5px; color:var(--red); display:none;}
  .field.invalid .errmsg{display:block;}
  .radiorow{display:flex; gap:16px; padding-top:4px;}
  .radiorow label{display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; color:var(--ink);}
  .radiorow input{width:auto;}

  fieldset{border:none; padding:0; margin:0;}
  legend{padding:0;}

  .subhead{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--brass-dark); font-weight:700; margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--border);}
  .subhead:first-child{margin-top:0; padding-top:0; border-top:none;}

  /* checkbox groups */
  .check-groups{display:flex; flex-direction:column; gap:14px;}
  .check-group-title{font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:6px;}
  .check-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px 16px;}
  .checkitem{display:flex; align-items:flex-start; gap:8px; font-size:13.5px; padding:4px 0;}
  .checkitem input{margin-top:3px; width:auto; flex:none;}
  .checkitem .flag{color:var(--brass-dark); font-weight:700;}

  .warnbox{
    background:var(--amber-bg); border:1px solid #E3C58A; border-radius:8px; padding:10px 13px;
    font-size:12.5px; color:var(--brass-dark); margin-bottom:14px; display:flex; gap:8px;
  }
  :root[data-theme="dark"] .warnbox{color:#E3B96B;}
  .warnbox b{color:inherit;}

  /* cascade widgets */
  .cascade{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .cascade-result{
    grid-column:1/-1; font-size:12.5px; padding:8px 11px; border-radius:7px; background:var(--paper);
    border:1px dashed var(--border-2); color:var(--muted);
  }
  .cascade-result b{color:var(--ink); font-family:ui-monospace,monospace;}

  /* repeatable rows (percent distribution, relationships, bank accounts) */
  .repeat-row{
    display:grid; grid-template-columns:1fr 100px 34px; gap:10px; align-items:end; margin-bottom:8px;
  }
  .repeat-row.rel-row{grid-template-columns:1.3fr 1fr 1fr 34px;}
  .repeat-row.bank-row{grid-template-columns:1.4fr 1fr 1fr .8fr 34px;}
  .rowbtn{
    width:34px;height:34px;border-radius:7px;border:1px solid var(--border-2); background:var(--card);
    color:var(--muted); font-size:16px; line-height:1;
  }
  .rowbtn:hover{border-color:var(--red); color:var(--red);}
  .addrow-btn{
    border:1px dashed var(--border-2); background:none; color:var(--brass-dark); font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:7px; margin-top:4px;
  }
  .addrow-btn:hover{border-color:var(--brass-dark); background:var(--amber-bg);}
  .sum-indicator{font-size:12px; margin-top:8px; padding:6px 10px; border-radius:6px; display:inline-block;}
  .sum-indicator.ok{background:var(--teal-bg); color:var(--teal);}
  .sum-indicator.bad{background:var(--red-bg); color:var(--red);}

  /* buttons */
  .btn{border-radius:8px; border:1px solid var(--border-2); background:var(--card); color:var(--ink); padding:10px 18px; font-size:13.5px; font-weight:600;}
  .btn:hover{border-color:var(--navy);}
  .btn-primary{background:var(--navy); border-color:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-brass{background:var(--brass); border-color:var(--brass); color:#fff;}
  .btn-brass:hover{background:var(--brass-dark);}
  .btn-ghost{background:none; border:none; color:var(--muted); text-decoration:underline;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btnbar{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap;}
  .btnbar .right{display:flex; gap:10px; flex-wrap:wrap;}

  /* reference tables (collapsible, read-only) */
  details.refbox{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:20px;}
  details.refbox summary{padding:16px 22px; font-family:var(--serif); font-weight:600; font-size:15.5px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;}
  details.refbox summary::-webkit-details-marker{display:none;}
  details.refbox summary .chev{transition:transform .15s; color:var(--muted); font-size:13px;}
  details.refbox[open] summary .chev{transform:rotate(90deg);}
  .refbox .refbody{padding:0 22px 20px;}
  .refbox input[type=search]{width:100%; padding:8px 10px; border:1px solid var(--border-2); border-radius:7px; margin-bottom:12px;}
  table.reftable{width:100%; border-collapse:collapse; font-size:13px;}
  table.reftable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--border-2);}
  table.reftable td{padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
  table.reftable tr:hover td{background:var(--paper);}
  table.reftable td.code{font-family:ui-monospace,monospace; font-weight:600; color:var(--brass-dark); white-space:nowrap;}
  .ref-group-row td{font-weight:700; background:var(--paper); padding-top:12px;}

  /* review page */
  .review-section{margin-bottom:18px;}
  .review-section h3{font-size:14px; color:var(--brass-dark); margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);}
  .review-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 24px;}
  .review-item{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:3px 0; border-bottom:1px dotted var(--border);}
  .review-item .k{color:var(--muted);}
  .review-item .v{font-weight:600; text-align:right;}
  .review-item.empty .v{color:var(--muted); font-weight:400; font-style:italic;}
  .missing-banner{background:var(--red-bg); border:1px solid #E3B4AC; color:var(--red); padding:12px 16px; border-radius:8px; font-size:13.5px; margin-bottom:16px;}
  .missing-banner ul{margin:6px 0 0; padding-left:18px;}
  .missing-banner a{color:var(--red); font-weight:600;}

  /* queue */
  .queue-toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .queue-toolbar input[type=search]{flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--border-2); border-radius:8px;}
  .queue-toolbar select{padding:9px 10px; border:1px solid var(--border-2); border-radius:8px;}
  .queue-item{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .queue-item .qhead{display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer;}
  .queue-item .qhead:hover{background:var(--paper);}
  .queue-item .qname{font-weight:700; font-size:14.5px;}
  .queue-item .qmeta{font-size:12px; color:var(--muted);}
  .status-pill{font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
  .status-pill.pending{background:var(--amber-bg); color:var(--brass-dark);}
  .status-pill.processed{background:var(--teal-bg); color:var(--teal);}
  .qspacer{flex:1;}
  .qbody{padding:0 18px 18px; display:none; border-top:1px solid var(--border);}
  .queue-item.open .qbody{display:block; padding-top:14px;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty-state .big{font-size:34px; margin-bottom:10px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px); opacity:0;
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px;
    transition:opacity .2s, transform .2s; pointer-events:none; z-index:50; box-shadow:0 6px 18px rgba(0,0,0,.2);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .step-wrap{display:none;}
  .step-wrap.active{display:block;}

  /* ---------- printable PDF export ---------- */
  #printArea{display:none;}
  .pp-page{font-family:var(--sans); color:#1a1a1a; max-width:7.5in; margin:0 auto; padding:0.4in 0;}
  .pp-header{border-bottom:3px solid #A9762E; padding-bottom:10px; margin-bottom:18px;}
  .pp-header h1{font-family:var(--serif); font-size:19px; color:#0F2A43; margin:0 0 4px;}
  .pp-header .pp-meta{font-size:12px; color:#444;}
  .pp-section{margin-bottom:16px; break-inside:avoid; page-break-inside:avoid;}
  .pp-section h2{font-family:var(--serif); font-size:13px; color:#8A5F22; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid #ccc; padding-bottom:4px; margin:0 0 8px;}
  .pp-grid{display:grid; grid-template-columns:1fr 1fr; gap:3px 22px;}
  .pp-item{display:flex; justify-content:space-between; gap:10px; font-size:11.5px; padding:2px 0; border-bottom:1px dotted #ddd;}
  .pp-item .pp-k{color:#555;}
  .pp-item .pp-v{font-weight:600; text-align:right; color:#111;}
  .pp-item.pp-empty .pp-v{color:#999; font-weight:400; font-style:italic;}
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; }
    @page{ margin:0.5in; size:letter; }
    .pp-grid{ grid-template-columns:1fr 1fr; }
  }

  @media (max-width: 900px){
    .app{flex-direction:column;}
    .sidenav{
      width:100%; position:static; padding:12px 16px 0; overflow-x:auto;
    }
    .sidenav ol{display:flex; border-left:none; border-bottom:2px solid var(--border); gap:2px;}
    .sidenav li{flex:none;}
    .sidenav button{padding:8px 12px; white-space:nowrap;}
    .sidenav li .dot{display:none;}
    main{padding:18px 16px 60px;}
    .grid, .grid.cols-3{grid-template-columns:1fr;}
    .field.span-2{grid-column:span 1;}
    .review-grid{grid-template-columns:1fr;}
    .cascade{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="seal">LV</div>
  <div class="titles">
    <div class="city">City of La Verne · Human Resources → Payroll</div>
    <h1>New Employee Payroll Setup</h1>
  </div>
</div>

<div id="formView"></div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>

// the salary-chart pickers below. Titles are unique across the two charts

// human-readable value on its own \u2014 no chart prefix needed.
const JOB_TITLE_OPTGROUPS = [
  { label:'Full-Time Positions', options: FT_POSITIONS.map(function(p){ return {value:p.title, label:p.title+' \u2014 Grade '+p.grade}; }) },
  { label:'Part-Time Positions', options: PT_POSITIONS.map(function(p){ return {value:p.title, label:p.title+' \u2014 Grade '+p.grade}; }) },
];
function findPositionByTitle(title){
  let p = FT_POSITIONS.find(function(x){ return x.title===title; });
  if(p) return Object.assign({chart:'FT'}, p);
  p = PT_POSITIONS.find(function(x){ return x.title===title; });
  if(p) return Object.assign({chart:'PT'}, p);
  return null;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderField(f){
  const val = state.data[f.id] || '';
  const invalidClass = state.invalidFields && state.invalidFields[f.id] ? ' invalid' : '';
  let control = '';
  if(f.type === 'select'){
    let optsHtml;
    if(f.optgroups){
      optsHtml = f.optgroups.map(function(g){
        return '<optgroup label="'+esc(g.label)+'">' + g.options.map(function(o){
          return '<option value="'+esc(o.value)+'"'+(val===o.value?' selected':'')+'>'+esc(o.label)+'</option>';
        }).join('') + '</optgroup>';
      }).join('');
    } else {
      optsHtml = f.options.map(function(o){
        return '<option value="'+esc(o.value)+'"'+(val===o.value?' selected':'')+'>'+esc(o.label)+'</option>';
      }).join('');
    }
    control = '<select id="f_'+f.id+'" data-field="'+f.id+'">' +
      '<option value="">Select\u2026</option>' + optsHtml + '</select>';
  } else if(f.type === 'textarea'){
    control = '<textarea id="f_'+f.id+'" data-field="'+f.id+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(val)+'</textarea>';
  } else {
    const step = f.step ? ' step="'+f.step+'"' : '';
    const maxlen = f.maxlen ? ' maxlength="'+f.maxlen+'"' : '';
    const maskAttr = f.mask ? ' data-mask="'+f.mask+'"' : '';
    control = '<input type="'+(f.type||'text')+'" id="f_'+f.id+'" data-field="'+f.id+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder||'')+'"'+step+maxlen+maskAttr+'>';
  }
  return '<div class="field'+(f.span2?' span-2':'')+invalidClass+'" id="wrap_'+f.id+'">' +
    '<label for="f_'+f.id+'">'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>' +
    control +
    (f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'') +
    (f.pattern && state.invalidFields && state.invalidFields[f.id]==='format' ? '<div class="errmsg">Please enter a valid '+esc(f.label.toLowerCase())+' (e.g. '+esc(f.placeholder||'')+').</div>' : '<div class="errmsg">This field is required.</div>') +
  '</div>';
}

/* =========================================================================
   INPUT MASKING (SSN, phone) — formats as the person types, and blocks
   non-numeric characters so the stored value always matches the field's
   validation pattern.
   ========================================================================= */
function formatSSN(raw){
  const d = raw.replace(/\D/g,'').slice(0,9);
  if(d.length <= 3) return d;
  if(d.length <= 5) return d.slice(0,3)+'-'+d.slice(3);
  return d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5);
}
function formatPhone(raw){
  const d = raw.replace(/\D/g,'').slice(0,10);
  if(d.length === 0) return '';
  if(d.length < 4) return '('+d;
  if(d.length < 7) return '('+d.slice(0,3)+') '+d.slice(3);
  return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
}
const MASKS = { ssn: formatSSN, phone: formatPhone };

function bindGenericFields(container){
  container.querySelectorAll('[data-field]').forEach(function(node){
    const id = node.getAttribute('data-field');
    const evt = (node.tagName === 'SELECT') ? 'change' : 'input';
    const maskName = node.getAttribute('data-mask');
    node.addEventListener(evt, function(){
      if(maskName && MASKS[maskName]){
        const formatted = MASKS[maskName](node.value);
        if(formatted !== node.value) node.value = formatted;
      }
      state.data[id] = node.value;
      if(state.invalidFields && state.invalidFields[id]){
        delete state.invalidFields[id];
        node.classList.remove('err');
        const wrap = document.getElementById('wrap_'+id);
        if(wrap) wrap.classList.remove('invalid');
      }
      if(id === 'title'){
        // Job Title shares state.position with the Position & Employment and
        // Pay Setup pickers, so choosing it here carries through to both.
        const p = findPositionByTitle(node.value);
        if(p){
          const changed = state.position.title !== p.title;
          state.position = { chart:p.chart, grade:p.grade, title:p.title, step: changed ? '' : state.position.step, hrs:p.hrs, rt:p.rt };
          if(changed){
            state.data.hourlySalaried = ''; state.data.hoursPerYear = ''; state.data.hourlyBaseRate = ''; state.data.annualBaseRate = '';
          }
        }
      }
    });
  });
}

function renderCascade(opts){
  // opts: {id, label, groups, stateObj, warnGlobal}
  const groups = opts.groups;
  const cur = opts.stateObj;
  const groupOpts = groups.map(function(g,i){
    return '<option value="'+i+'"'+(cur.group===g.g?' selected':'')+'>'+esc(g.g)+'</option>';
  }).join('');
  const selGroup = groups.find(function(g){ return g.g === cur.group; });
  const tierOpts = selGroup ? selGroup.tiers.map(function(t){
    const amt = t[2] != null ? '  \u2014  $'+t[2].toFixed(2) : '';
    return '<option value="'+esc(t[1])+'"'+(cur.tier===t[1]?' selected':'')+'>'+esc(t[0])+' \u2014 '+esc(t[1])+amt+'</option>';
  }).join('') : '';
  const warn = selGroup && selGroup.warn ? '<div class="warnbox">\u26A0\uFE0F <span>'+esc(selGroup.warn)+'</span></div>' : '';
  const curTierData = selGroup ? selGroup.tiers.find(function(t){ return t[1]===cur.tier; }) : null;
  const curAmt = curTierData && curTierData[2] != null ? ' \u2014 $'+curTierData[2].toFixed(2) : '';
  return '<div class="field span-2">' +
    '<label>'+esc(opts.label)+(opts.required?' <span class="req">*</span>':'')+'</label>' +
    '<div class="cascade">' +
      '<select data-cascade-group="'+opts.id+'"><option value="">Select group\u2026</option>'+groupOpts+'</select>' +
      '<select data-cascade-tier="'+opts.id+'" '+(selGroup?'':'disabled')+'><option value="">'+(selGroup?'Select tier\u2026':'Select a group first')+'</option>'+tierOpts+'</select>' +
      (warn ? '<div class="cascade-result" style="grid-column:1/-1">'+warn+'</div>' : '') +
      (cur.group && cur.tier ? '<div class="cascade-result">Selected code: <b>'+esc(cur.tier)+'</b> \u2014 '+esc(cur.group)+esc(curAmt)+'</div>' : '') +
    '</div>' +
  '</div>';
}
function bindCascade(container, id, groups, stateObj, rerenderFn){
  const gSel = container.querySelector('[data-cascade-group="'+id+'"]');
  const tSel = container.querySelector('[data-cascade-tier="'+id+'"]');
  if(gSel) gSel.addEventListener('change', function(){
    const g = groups[parseInt(gSel.value,10)];
    stateObj.group = g ? g.g : '';
    stateObj.tier = '';
    rerenderFn();
  });
  if(tSel) tSel.addEventListener('change', function(){ stateObj.tier = tSel.value; rerenderFn(); });
}

function bindPositionTitlePicker(container){
  const sel = container.querySelector('#posTitleSelect');
  if(!sel) return;
  sel.addEventListener('change', function(){
    if(!sel.value){
      state.position = {chart:'',grade:'',title:'',step:'',hrs:0,rt:''};
      state.data.title = '';
    } else {
      const parts = sel.value.split('|');
      const chart = parts[0], title = parts.slice(1).join('|');
      const p = findPosition(chart, title);
      const changed = state.position.chart !== chart || state.position.title !== title;
      state.position = { chart:chart, grade:p.grade, title:p.title, step: changed ? '' : state.position.step, hrs:p.hrs, rt:p.rt };
      state.data.title = p.title;
      if(changed){
        // clear any pay figures pulled from a previous position so nothing stale carries over
        state.data.hourlySalaried = ''; state.data.hoursPerYear = ''; state.data.hourlyBaseRate = ''; state.data.annualBaseRate = '';
      }
    }
    renderCurrentSection();
  });

function allPositions(){
  return FT_POSITIONS.map(function(p){ return Object.assign({chart:'FT'}, p); })

function findPosition(chart, title){
  const list = chart === 'FT' ? FT_POSITIONS : PT_POSITIONS;
  return list.find(function(p){ return p.title === title; });
}
function renderPositionPicker(){
  const pos = state.position;

  const current = pos.title ? findPosition(pos.chart, pos.title) : null;
  const stepOpts = current ? current.steps.map(function(s){
    const amt = current.rt === 'A' ? '$'+s[2].toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'/yr' : '$'+s[1].toFixed(4)+'/hr';
    return '<option value="'+s[0]+'"'+(pos.step===String(s[0])?' selected':'')+'>Step '+s[0]+' \u2014 '+amt+'</option>';
  }).join('') : '';
  let html = '<div class="subhead">Position (from current salary chart)</div>';

    '<select id="posSelect"><option value="">Select position\u2026</option>' +
      '<optgroup label="Full-Time Positions">'+ftOpts+'</optgroup>' +
      '<optgroup label="Part-Time Positions">'+ptOpts+'</optgroup>' +
    '</select>' +
    '<select id="posStepSelect" '+(current?'':'disabled')+'><option value="">'+(current?'Select step\u2026':'Select a position first')+'</option>'+stepOpts+'</select>';
  if(current && pos.step){
    const stepData = current.steps.find(function(s){ return String(s[0])===pos.step; });
    const rateStr = current.rt === 'A'
      ? '$'+stepData[2].toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'/yr (salaried)'+(current.hrs>0?' \u2014 $'+(Math.round((stepData[2]/current.hrs)*10000)/10000).toFixed(4)+'/hr equiv.':'')
      : '$'+stepData[1].toFixed(4)+'/hr (hourly)';
    html += '<div class="cascade-result" style="grid-column:1/-1;">Grade <b>'+esc(current.grade)+'</b> \u2014 '+esc(current.title)+', Step '+esc(pos.step)+' \u2014 '+rateStr+
      (pos.chart==='FT' ? ' \u2014 '+current.hrs.toLocaleString()+' hrs/yr' : '') + '</div>';
  }
  html += '</div>';
  html += '<div class="hint">Full-time rates are from the FT Salary Chart effective July 12, 2026; part-time rates are from the PT Salary Chart effective January 11, 2026. If the position isn\u2019t on either chart, leave this blank and enter the rate manually below.</div>';
  return html;
}
function applyPositionToFields(){
  const pos = state.position;
  const current = pos.title ? findPosition(pos.chart, pos.title) : null;
  if(!current || !pos.step) return;
  const stepData = current.steps.find(function(s){ return String(s[0])===pos.step; });
  if(!stepData) return;
  state.data.hourlySalaried = current.rt === 'A' ? 'S' : 'H';
  if(pos.chart === 'FT') state.data.hoursPerYear = String(current.hrs);
  if(current.rt === 'A'){
    state.data.annualBaseRate = stepData[2];
    state.data.hourlyBaseRate = (current.hrs > 0) ? Math.round((stepData[2] / current.hrs) * 10000) / 10000 : '';
  } else {
    state.data.hourlyBaseRate = stepData[1];
    state.data.annualBaseRate = '';
  }
}

/* =========================================================================
   SECTION DISPATCH, SIDENAV, VALIDATION
   ========================================================================= */
const CUSTOM_RENDERERS = {
  emergency:   { render: renderEmergency,      bind: bindEmergency },
  accrual:     { render: renderAccrual,        bind: bindAccrual },
  benefits:    { render: renderBenefits,       bind: bindBenefits },
  tax:         { render: renderTax,            bind: bindGenericFields },
  relationships: { render: renderRelationships, bind: bindRelationships },
  directdeposit: { render: renderDirectDeposit, bind: bindDirectDeposit },
  review:      { render: renderReview,         bind: bindReview },
};
const APPEND_RENDERERS = {
  percentDist: { render: renderPercentDist, bind: bindPercentDist },
};
const PREPEND_RENDERERS = {
  positionPicker: { render: renderPositionPicker, bind: bindPositionPicker },
  positionTitlePicker: { render: renderPositionTitlePicker, bind: bindPositionTitlePicker },
};

function sectionIsComplete(sec){
  if(sec.custom === 'review') return false;
  if(sec.fields){
    for(const f of sec.fields){ if(f.required && !state.data[f.id]) return false; }
  }
  if(sec.id === 'position'){
    const total = state.percentDist.reduce(function(s,r){ return s + (parseFloat(r.pct)||0); }, 0);
    if(state.percentDist.some(function(r){return !r.account || r.pct==='';}) || Math.abs(total-100) > 0.01) return false;
    if(!state.position.title) return false;
  }
  if(sec.id === 'emergency'){
    const e = state.emergency;
    if(!e.p_name || !e.p_rel || !e.p_phone) return false;
  }
  if(sec.id === 'accrual' && !state.data.sickLeave) return false;
  if(sec.id === 'pay' && !(state.position.title && state.position.step)) return false;
  if(sec.id === 'directdeposit'){
    const b1 = state.bank1;
    if(!b1.bank || !b1.routing || !b1.account) return false;
    if(b1.method==='split'){
      const b2 = state.bank2;
      if(!b2.bank || !b2.routing || !b2.account) return false;
    }
  }
  if(sec.id === 'tax'){
    if(!state.data.stMaritalStatus || !state.data.fedFilingStatus) return false;
  }
  return true;
}

function renderSidenav(){
  const nav = document.getElementById('sidenavList');
  if(!nav) return;
  nav.innerHTML = SECTIONS.map(function(sec,i){
    const active = i===state.currentSection ? ' active' : '';
    const done = sectionIsComplete(sec) ? ' done' : '';
    return '<li class="'+ (active||done) +'"><span class="dot"></span><button data-goto="'+i+'">'+esc(sec.title)+'</button></li>';
  }).join('');
  nav.querySelectorAll('[data-goto]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.currentSection = parseInt(btn.getAttribute('data-goto'),10); renderCurrentSection(); });
  });
}

function renderCurrentSection(){
  const sec = SECTIONS[state.currentSection];
  const main = document.getElementById('formMain');
  let bodyHtml;
  if(sec.custom){
    bodyHtml = CUSTOM_RENDERERS[sec.custom].render();
  } else {
    bodyHtml = '<div class="grid">' + sec.fields.map(renderField).join('') + '</div>';
  }
  if(sec.prependCustom){
    bodyHtml = PREPEND_RENDERERS[sec.prependCustom].render() + bodyHtml;
  }
  if(sec.appendCustom){
    bodyHtml += APPEND_RENDERERS[sec.appendCustom].render();
  }
  const isReview = sec.custom === 'review';
  main.innerHTML =
    '<div class="section-card">' +
      (isReview ? '' : ('<h2>'+esc(sec.title)+'</h2>' + (sec.desc?'<div class="section-desc">'+esc(sec.desc)+'</div>':''))) +
      bodyHtml +
    '</div>' +
    (isReview ? '' : (
      '<div class="btnbar">' +
        '<button class="btn" id="btnPrev" '+(state.currentSection===0?'disabled':'')+'>\u2190 Back</button>' +
        '<div class="right">' +
          '<button class="btn" id="btnSaveExit">Save &amp; review later</button>' +
          '<button class="btn btn-primary" id="btnNext">'+(state.currentSection===SECTIONS.length-2?'Continue to Review \u2192':'Continue \u2192')+'</button>' +
        '</div>' +
      '</div>'
    ));

  if(!sec.custom) bindGenericFields(main);
  if(sec.custom) CUSTOM_RENDERERS[sec.custom].bind(main);
  if(sec.appendCustom) APPEND_RENDERERS[sec.appendCustom].bind(main);
  if(sec.prependCustom) PREPEND_RENDERERS[sec.prependCustom].bind(main);

  const prevBtn = document.getElementById('btnPrev');
  if(prevBtn) prevBtn.addEventListener('click', function(){ state.currentSection--; renderCurrentSection(); window.scrollTo(0,0); });
  const nextBtn = document.getElementById('btnNext');
  if(nextBtn) nextBtn.addEventListener('click', function(){
    if(validateSection(sec)){
      state.currentSection++; renderCurrentSection(); window.scrollTo(0,0);
    } else {
      showToast('Please complete the required fields highlighted below.');
    }
  });
  const saveExitBtn = document.getElementById('btnSaveExit');
  if(saveExitBtn) saveExitBtn.addEventListener('click', function(){ showToast('Progress is kept in this browser tab \u2014 come back anytime before submitting.'); });

  renderSidenav();
}

function validateSection(sec){
  state.invalidFields = {};
  let ok = true;
  if(sec.fields){
    sec.fields.forEach(function(f){
      if(f.required && !state.data[f.id]){ state.invalidFields[f.id] = 'required'; ok = false; }
      if(f.pattern && state.data[f.id]){
        const re = new RegExp(f.pattern);
        if(!re.test(state.data[f.id])){ state.invalidFields[f.id] = 'format'; ok = false; }
      }
    });
  }
  if(sec.id === 'emergency'){
    const e = state.emergency;
    if(!e.p_name || !e.p_rel || !e.p_phone) ok = false;
  }
  if(sec.id === 'accrual' && !state.data.sickLeave) ok = false;
  if(sec.id === 'pay' && !(state.position.title && state.position.step)) ok = false;
  if(sec.id === 'position'){
    const total = state.percentDist.reduce(function(s,r){ return s + (parseFloat(r.pct)||0); }, 0);
    if(state.percentDist.some(function(r){return !r.account || r.pct==='';}) || Math.abs(total-100) > 0.01) ok = false;
    if(!state.position.title) ok = false;
  }
  if(sec.id === 'directdeposit'){
    const b1 = state.bank1;
    if(!b1.bank || !b1.routing || !b1.account) ok = false;
    if(b1.method==='split'){ const b2=state.bank2; if(!b2.bank||!b2.routing||!b2.account) ok = false; }
  }
  if(sec.id === 'tax' && (!state.data.stMaritalStatus || !state.data.fedFilingStatus)) ok = false;
  if(!ok) renderCurrentSection();
  markInvalid();
  return ok;
}
function markInvalid(){
  if(!state.invalidFields) return;
  Object.keys(state.invalidFields).forEach(function(id){
    const input = document.getElementById('f_'+id);
    const wrap = document.getElementById('wrap_'+id);
    if(input) input.classList.add('err');
    if(wrap) wrap.classList.add('invalid');
  });
}

/* =========================================================================
   SUMMARY BUILDING (shared by review page, DB record, and downloaded file)
   ========================================================================= */
function codeLabel(list, val){
  const hit = list.find(function(o){ return o.v === val; });
  if(!hit) return '';
  const code = fieldCode(hit);
  return hit.l === code ? hit.l : (hit.l + ' (' + code + ')');
}
function fullName(){
  const d = state.data;
  return [d.firstName, d.mi, d.lastName].filter(Boolean).join(' ') || '(name not entered)';
}
function buildSummarySections(){
  const d = state.data;
  const out = [];
  SECTIONS.forEach(function(sec){
    if(sec.custom === 'review') return;
    const items = [];
    if(sec.fields){
      sec.fields.forEach(function(f){
        let v = d[f.id] || '';
        if(f.type === 'select' && v){
          if(f.optgroups){
            const flat = [].concat.apply([], f.optgroups.map(function(g){return g.options;}));
            const hit = flat.find(function(o){ return o.value===v; });
            v = hit ? hit.label : v;
          } else {
            v = codeLabel(f.options.map(function(o){return {v:o.value,l:o.label};}), v);
          }
        }
        items.push({ k:f.label, v:v, missing: f.required && !d[f.id] });
      });
    }
    if(sec.id === 'position'){
      const p = state.position;
      items.unshift({k:'Authorized Position', v: p.title ? (p.title+' (Grade '+p.grade+', '+(p.chart==='FT'?'Full-Time':'Part-Time')+' chart)') : '', missing: !p.title});
      state.percentDist.forEach(function(r,i){
        if(r.account || r.pct){
          const flat = [].concat.apply([], DEPT_ACCOUNT_OPTGROUPS.map(function(g){return g.options;}));
          const hit = flat.find(function(o){ return o.value===r.account; });
          items.push({k:'Distribution line '+(i+1), v:(hit?hit.label:(r.account||'\u2014'))+' \u2014 '+(r.pct||'0')+'%'});
        }
      });
    }
    if(sec.id === 'pay'){
      const p = state.position;
      const posStr = p.title ? (p.title+' \u2014 Grade '+p.grade+', Step '+p.step+' ('+(p.chart==='FT'?'Full-Time':'Part-Time')+' chart)') : '';
      items.unshift({k:'Position (salary chart)', v: posStr, missing: !posStr});
    }
    if(sec.id === 'emergency'){
      const e = state.emergency;
      items.push({k:'Primary contact', v:e.p_name||'', missing:!e.p_name});
      items.push({k:'Primary relationship', v:codeLabel(CODES.relationship,e.p_rel)||'', missing:!e.p_rel});
      items.push({k:'Primary phone', v:e.p_phone||'', missing:!e.p_phone});
      items.push({k:'Primary other phone', v:e.p_phone2||''});
      items.push({k:'Secondary contact', v:e.s_name||''});
      items.push({k:'Secondary relationship', v:codeLabel(CODES.relationship,e.s_rel)||''});
      items.push({k:'Secondary phone', v:e.s_phone||''});
    }
    if(sec.id === 'accrual'){
      items.push({k:'Comp time code', v:codeLabel(CODES.compTime, d.compTime)||''});
      items.push({k:'On-call court comp time', v:d.onCallComp==='Y'?'Yes':(d.onCallComp==='N'?'No':'')});
      items.push({k:'Sick leave code', v:codeLabel(CODES.sickLeave, d.sickLeave)||'', missing:!d.sickLeave});
      items.push({k:'Vacation code', v: state.vacation.tier ? (state.vacation.tier+' \u2014 '+state.vacation.group) : '', missing:!state.vacation.tier});
    }
    if(sec.id === 'benefits'){
      const addPayLabels = [];
      ADD_PAY_GROUPS.forEach(function(g){ g.items.forEach(function(it){ if(state.addPay.indexOf(it.v)>-1) addPayLabels.push(it.l+' ('+fieldCode(it)+')'); }); });
      items.push({k:'Additional pay', v: addPayLabels.join('; ') || 'None'});
      items.push({k:'Health plan', v: state.health.tier ? (state.health.group+' \u2014 '+state.health.tier) : 'None elected'});
      items.push({k:'Dental plan', v: state.dental.tier ? (state.dental.group+' \u2014 '+state.dental.tier) : 'None elected'});
      items.push({k:'Vision plan', v: state.vision.tier ? ('MetLife Vision \u2014 '+state.vision.tier) : 'None elected'});
      function pickLabels(groups, arr){
        const out = [];
        groups.forEach(function(g){ g.items.forEach(function(it){ if(arr.indexOf(it.v)>-1) out.push(it.l+' ('+fieldCode(it)+')'); }); });
        return out.join('; ') || 'None';
      }
      items.push({k:'Supplemental insurance', v: pickLabels(SUPPLEMENTAL_GROUPS, state.supplemental)});
      items.push({k:'Flexible spending account', v: pickLabels([FSA_GROUP], state.fsa)});
      items.push({k:'Deferred compensation', v: pickLabels(DEFCOMP_GROUPS, state.defcomp)});
      const dedLabels = CODES.deduction.filter(function(o){ return state.deductions.indexOf(o.v)>-1; }).map(function(o){ return o.l+' ('+o.v+')'; });
      items.push({k:'Other deductions', v: dedLabels.join('; ') || 'None'});
    }
    if(sec.id === 'relationships'){
      const rows = state.relationships.filter(function(r){ return r.name; });
      if(rows.length === 0) items.push({k:'Relatives disclosed', v:'None'});
      rows.forEach(function(r,i){
        items.push({k:'Relative '+(i+1), v: r.name+' \u2014 '+(codeLabel(CODES.relationship,r.rel)||'?')+(r.dept?(' \u2014 '+r.dept):'')});
      });
    }
    if(sec.id === 'directdeposit'){
      const b1 = state.bank1;
      items.push({k:'Account 1 bank', v:b1.bank||'', missing:!b1.bank});
      items.push({k:'Account 1 routing / acct #', v:(b1.routing||'?')+' / '+(b1.account||'?'), missing:!b1.routing||!b1.account});
      items.push({k:'Account 1 type', v:b1.type});
      items.push({k:'Deposit method', v: b1.method==='split' ? 'Split with a second account' : 'Full net pay'});
      if(b1.method==='split'){
        items.push({k:'Account 1 amount', v:b1.amount||''});
        const b2 = state.bank2;
        items.push({k:'Account 2 bank', v:b2.bank||'', missing:!b2.bank});
        items.push({k:'Account 2 routing / acct #', v:(b2.routing||'?')+' / '+(b2.account||'?'), missing:!b2.routing||!b2.account});
        items.push({k:'Account 2 type', v:b2.type});
      }
    }
    out.push({ title: sec.title, items: items });
  });
  return out;
}
function buildSummaryText(){
  const sections = buildSummarySections();
  let lines = [];
  lines.push('CITY OF LA VERNE \u2014 NEW EMPLOYEE PAYROLL SETUP');
  lines.push('Employee: ' + fullName());
  lines.push('Prepared: ' + new Date().toLocaleString());
  lines.push('='.repeat(60));
  sections.forEach(function(s){
    lines.push('');
    lines.push(s.title.toUpperCase());
    lines.push('-'.repeat(s.title.length));
    s.items.forEach(function(it){
      lines.push((it.k+':').padEnd(38,' ') + (it.v || '(not provided)'));
    });
  });
  return lines.join('\n');
}

/* =========================================================================
   PDF EXPORT (styled like the Review & Submit page, via the browser's
   native print-to-PDF \u2014 no external library needed)
   ========================================================================= */
function buildPrintableHTML(){
  const sections = buildSummarySections();
  let html = '<div class="pp-page">';
  html += '<div class="pp-header"><h1>City of La Verne \u2014 New Employee Payroll Setup</h1>' +
    '<div class="pp-meta">Employee: '+esc(fullName())+' &nbsp;\u00b7&nbsp; Prepared: '+esc(new Date().toLocaleString())+'</div></div>';
  sections.forEach(function(s){
    html += '<div class="pp-section"><h2>'+esc(s.title)+'</h2><div class="pp-grid">';
    s.items.forEach(function(it){
      html += '<div class="pp-item'+(!it.v?' pp-empty':'')+'"><span class="pp-k">'+esc(it.k)+'</span><span class="pp-v">'+esc(it.v||'\u2014')+'</span></div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}
function exportPDF(){
  const area = document.getElementById('printArea');
  area.innerHTML = buildPrintableHTML();
  window.print();
}

function renderReview(){
  const sections = buildSummarySections();
  const missing = [];
  sections.forEach(function(s, si){ s.items.forEach(function(it){ if(it.missing) missing.push({sec:si, label:it.k}); }); });
  let html = '<div class="section-card"><h2>Review &amp; Submit</h2>';
  html += '<div class="section-desc">Check everything below, then send it to Payroll. You can jump back to any section to fix something.</div>';
  if(missing.length){
    html += '<div class="missing-banner"><b>'+missing.length+' required item'+(missing.length>1?'s':'')+' still needed:</b><ul>' +
      missing.map(function(m){ return '<li><a href="#" data-jump="'+m.sec+'">'+esc(SECTIONS[m.sec].title)+'</a> \u2014 '+esc(m.label)+'</li>'; }).join('') +
    '</ul></div>';
  }
  sections.forEach(function(s, si){
    html += '<div class="review-section"><h3>'+esc(s.title)+' <a href="#" data-jump="'+si+'" style="font-size:11px; font-weight:400; float:right;">Edit</a></h3><div class="review-grid">';
    s.items.forEach(function(it){
      html += '<div class="review-item'+(!it.v?' empty':'')+'"><span class="k">'+esc(it.k)+'</span><span class="v">'+esc(it.v || '\u2014')+'</span></div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  html += '<div class="btnbar">' +
    '<button class="btn" id="btnBackFromReview">\u2190 Back to form</button>' +
    '<div class="right">' +
      '<button class="btn" id="btnDownloadSummary">\u2b07 Download as text</button>' +
      '<button class="btn" id="btnCopySummary">\u2398 Copy summary</button>' +
      '<button class="btn" id="btnExportPDF">\uD83D\uDDA8\uFE0F Export as PDF</button>' +
      '<button class="btn btn-brass" id="btnSubmitToPayroll" '+(missing.length?'disabled':'')+'>Finish for Payroll \u2192</button>' +
    '</div>' +
  '</div>';
  return html;
}
function bindReview(container){
  container.querySelectorAll('[data-jump]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); state.currentSection = parseInt(a.getAttribute('data-jump'),10); renderCurrentSection(); window.scrollTo(0,0); });
  });
  const backBtn = document.getElementById('btnBackFromReview');
  if(backBtn) backBtn.addEventListener('click', function(){ state.currentSection = SECTIONS.length-2; renderCurrentSection(); });
  const dlBtn = document.getElementById('btnDownloadSummary');
  if(dlBtn) dlBtn.addEventListener('click', downloadSummary);
  const cpBtn = document.getElementById('btnCopySummary');
  if(cpBtn) cpBtn.addEventListener('click', copySummary);
  const pdfBtn = document.getElementById('btnExportPDF');
  if(pdfBtn) pdfBtn.addEventListener('click', exportPDF);
  const subBtn = document.getElementById('btnSubmitToPayroll');
  if(subBtn) subBtn.addEventListener('click', submitToPayroll);
}

async function downloadSummary(){
  const text = buildSummaryText();
  const filename = 'new-employee-' + (state.data.lastName||'unnamed').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.txt';
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Summary downloaded.');
}
async function copySummary(){
  try{
    await navigator.clipboard.writeText(buildSummaryText());
    showToast('Summary copied to clipboard.');
  }catch(e){ showToast('Could not copy \u2014 try the download button instead.'); }
}

/* =========================================================================
   SUBMISSION (standalone build \u2014 no shared queue; HR exports a PDF (or
   downloads/copies a text summary) and sends it to Payroll directly.)
   ========================================================================= */
function submitToPayroll(){
  state.submitted = true;
  exportPDF();
  showSubmittedScreen();
}

function showSubmittedScreen(){
  const main = document.getElementById('formMain');
  main.innerHTML = '<div class="section-card" style="text-align:center; padding:50px 30px;">' +
    '<div style="font-size:40px;">\u2705</div>' +
    '<h2 style="margin-top:12px;">Ready for Payroll</h2>' +
    '<p style="color:var(--muted); max-width:46ch; margin:10px auto 22px;">'+esc(fullName())+'\u2019s setup information is ready. Use the print dialog\u2019s \u201cSave as PDF\u201d to save it, then send it to Payroll however you normally would (email, shared drive, etc.).</p>' +
    '<div class="btnbar" style="justify-content:center;">' +
      '<button class="btn" id="btnExportPDF2">\uD83D\uDDA8\uFE0F Export as PDF</button>' +
      '<button class="btn" id="btnDownloadSummary2">\u2b07 Download as text</button>' +
      '<button class="btn" id="btnCopySummary2">\u2398 Copy summary</button>' +
      '<button class="btn btn-primary" id="btnStartAnother">+ Start another submission</button>' +
    '</div>' +
  '</div>';
  document.getElementById('btnExportPDF2').addEventListener('click', exportPDF);
  document.getElementById('btnDownloadSummary2').addEventListener('click', downloadSummary);
  document.getElementById('btnCopySummary2').addEventListener('click', copySummary);
  document.getElementById('btnStartAnother').addEventListener('click', function(){ resetForm(); });
  document.getElementById('sidenavList') && (document.getElementById('sidenavList').innerHTML = '');
}

function resetForm(){
  state.data = { state: 'CA' };
  state.percentDist = [{account:'',pct:''}];
  state.emergency = { p_name:'', p_rel:'', p_phone:'', p_phone2:'', s_name:'', s_rel:'', s_phone:'', s_phone2:'' };
  state.vacation = {group:'',tier:''}; state.health = {group:'',tier:''}; state.dental = {group:'',tier:''}; state.vision = {tier:''};
  state.position = { chart:'', grade:'', title:'', step:'', hrs:0, rt:'' };
  state.addPay = []; state.supplemental = []; state.fsa = []; state.defcomp = [];
  state.deductions = []; state.relationships = [{name:'',rel:'',dept:''}];
  state.bank1 = { bank:'', routing:'', account:'', type:'Checking', method:'full', amount:'' };
  state.bank2 = { bank:'', routing:'', account:'', type:'Checking', amount:'' };
  state.currentSection = 0; state.submitted = false; state.invalidFields = {};
  renderFormView();
}

/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
function renderFormView(){
  const container = document.getElementById('formView');
  container.innerHTML = '<div class="app">' +
    '<nav class="sidenav"><div class="progress-label">New Employee Setup</div><ol id="sidenavList"></ol></nav>' +
    '<main id="formMain"></main>' +
  '</div>';
  renderCurrentSection();
}

renderFormView();
</script>
